name: sync-berita

on:
  schedule:
    # 1x/hari pukul 19:00 WIB (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sumber utama: Instagram resmi via API resmi (lebih cepat update).
      # Gagal (termasuk secrets belum diisi) -> lanjut ke fallback WordPress.
      - name: Crawl Instagram (sumber utama)
        id: ig
        continue-on-error: true
        run: set -o pipefail; node scripts/sync/crawl-ig.js 2>&1 | tee "$RUNNER_TEMP/sync.log"
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_URL: https://openagentic.id/api/v1/chat/completions
          LLM_MODEL: glm-5.3-flash

      - name: Crawl WordPress news (fallback)
        if: steps.ig.outcome != 'success'
        # pipefail: kegagalan crawl (exit 1 dari stage-gate) wajib menggagalkan step,
        # bukan tertutup exit 0 dari tee.
        run: set -o pipefail; node scripts/sync/crawl.js 2>&1 | tee "$RUNNER_TEMP/sync.log"
        env:
          # Rewrite AI aktif bila secret LLM_API_KEY terisi (openagentic.id)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_URL: https://openagentic.id/api/v1/chat/completions
          LLM_MODEL: glm-5.3-flash

      # Commit & push hasil sync memakai GITHUB_TOKEN (built-in, tanpa action pihak ketiga
      # yang rawan gagal resolve). Trigger Vercel rebuild lewat push ke main.
      # if: always() -> artikel yang rewrite-nya sukses tetap terbit meski run merah
      # (ada artikel gagal rewrite); pull --rebase dulu agar tidak race dengan push manual.
      - name: Commit & push hasil sync
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan konten"
          else
            git commit -m "chore: sync berita [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Ringkasan sync
        if: always()
        run: |
          {
            echo "### Hasil sync-berita"
            echo ""
            echo '```'
            tail -n 12 "$RUNNER_TEMP/sync.log" 2>/dev/null || echo "(log crawl tidak tersedia)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
