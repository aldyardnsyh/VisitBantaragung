name: sync-berita

on:
  schedule:
    # 1x/hari pukul 19:00 WIB (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl WordPress news
        run: node scripts/sync/crawl.js
        env:
          # Rewrite AI aktif bila secret LLM_API_KEY terisi (openagentic.id)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_URL: https://openagentic.id/api/v1/chat/completions
          LLM_MODEL: claude-sonnet-4.5-thinking

      # Commit & push hasil sync memakai GITHUB_TOKEN (built-in, tanpa action pihak ketiga
      # yang rawan gagal resolve). Trigger Vercel rebuild lewat push ke main.
      - name: Commit & push hasil sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan konten"
          else
            git commit -m "chore: sync berita [skip ci]"
            git push origin main
          fi
