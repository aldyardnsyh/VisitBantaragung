name: sync-berita

on:
  schedule:
    # Tiap 3 hari pukul 19:00 WIB (12:00 UTC).
    # */3 = tanggal 1,4,7,10,... (di bulan 31 hari sesekali jeda 2 hari: 31 -> 1).
    - cron: "0 12 */3 * *"
  workflow_dispatch:

# Cegah run tumpang-tindih (jadwal vs dispatch manual): run baru membatalkan
# run lama yang masih jalan, agar tidak double-push.
concurrency:
  group: sync-berita
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Rewrite 1 artikel bisa makan 3-5 menit (4x retry + backoff); antrean 5-6
    # artikel pernah bikin step crawl jalan >15 menit. Batas eksplisit agar run
    # gagal-jelas (timeout) bukan menggantung/cancel misterius.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl WordPress news
        # pipefail: kegagalan crawl (exit 1 dari stage-gate) wajib menggagalkan step,
        # bukan tertutup exit 0 dari tee.
        run: set -o pipefail; node scripts/sync/crawl.js 2>&1 | tee "$RUNNER_TEMP/sync.log"
        env:
          # Rewrite AI (openagentic.id). Model utama dicoba dulu; bila tidak
          # sehat, GATE 0 otomatis pakai fallback (lihat scripts/sync/crawl.js)
          # agar run tidak merah hanya karena satu model bermasalah.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_URL: https://openagentic.id/api/v1/chat/completions
          LLM_MODEL: muse-spark-1.3-free
          LLM_FALLBACK_MODELS: space-bunny-free
          # Maks artikel terbit per run (terbaru dulu). Backlog lama terkuras
          # bertahap tiap run 3-harian; melindungi kuota FREE & timeout 30 mnt.
          SYNC_MAX_PER_RUN: 6

      # Commit & push hasil sync memakai GITHUB_TOKEN (built-in, tanpa action pihak ketiga
      # yang rawan gagal resolve). Trigger Vercel rebuild lewat push ke main.
      # if: always() -> artikel yang rewrite-nya sukses tetap terbit meski run merah
      # (ada artikel gagal rewrite); pull --rebase dulu agar tidak race dengan push manual.
      - name: Commit & push hasil sync
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan konten"
          else
            git commit -m "chore: sync berita [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Ringkasan sync
        if: always()
        run: |
          {
            echo "### Hasil sync-berita"
            echo ""
            echo '```'
            # Tampilkan baris yang menjelaskan hasil, bukan sekadar ekor log:
            # FATAL (gate mana yang gagal), artikel gagal/skip, dan rekap done.
            grep -E "FATAL|rewrite gagal|skip \(thin|done\.|gate-sync|tidak ada artikel|gate-model\] OK" "$RUNNER_TEMP/sync.log" 2>/dev/null | tail -n 20 || echo "(log crawl tidak tersedia)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
